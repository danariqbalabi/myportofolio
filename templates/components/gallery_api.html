{% load static %}
{% csrf_token %}
<script src="{% static 'js/portfolio-api.js' %}"></script>
<script>
const IS_AUTHENTICATED = {{ user.is_authenticated|yesno:'true,false' }};
const CAN_EDIT_GALLERY = {{ can_edit_portfolio|yesno:'true,false' }};
const CAN_DELETE_GALLERY = {{ can_delete_portfolio|yesno:'true,false' }};
function galleryEndpoint(pattern, id) { return pattern.replace('/0/', `/${id}/`); }
function buildGalleryCardElement(item) {
    const article = document.createElement('article');
    article.className = 'gallery-card';
    const imageUrl = safePortfolioUrl(item.image);
    const category = item.category ? `<span class="gallery-category">${escapeHtml(item.category)}</span>` : '';
    const meta = `${item.location ? escapeHtml(item.location) + ' &middot; ' : ''}${escapeHtml(item.year)}`;
    const star = IS_AUTHENTICATED
        ? `<button type="button" class="button button-star${item.is_starred ? ' is-starred' : ''}" data-action="star" data-id="${item.id}"
            title="${escapeHtml(item.starred_by_names)}">${item.is_starred ? 'Unstar' : 'Star'} (${item.star_count})</button>`
        : `<a href="{% url 'main:login' %}" class="button">Login untuk star (${item.star_count})</a>`;
    const edit = CAN_EDIT_GALLERY ? `<a href="${galleryEndpoint("{% url 'main:update_gallery_item' 0 %}", item.id)}" class="button">Edit</a>` : '';
    const remove = CAN_DELETE_GALLERY ? `<button type="button" class="button button-danger" data-action="delete" data-id="${item.id}">Hapus</button>` : '';
    article.innerHTML = `${imageUrl ? `<div class="gallery-image-wrap"><img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(item.title)}"></div>` : ''}
        <div class="gallery-card-body">${category}<h2>${escapeHtml(item.title)}</h2><p class="gallery-meta">${meta}</p>
        ${item.caption ? `<p class="gallery-caption">${escapeHtml(item.caption)}</p>` : ''}<div class="project-actions">${star}${edit}${remove}</div></div>`;
    return article;
}
const {writeResource: writeGallery, fetchResources: fetchGallery} = initPortfolioApi({
    list: "{% url 'api:gallery-list' %}", detail: "{% url 'api:gallery-detail' 0 %}", star: "{% url 'api:gallery-star' 0 %}",
    placeholder: '0',
    grid: 'gallery-grid', loading: 'gallery-loading', error: 'gallery-error', empty: 'gallery-empty',
    search: 'gallery-search-input', searchForm: 'gallery-search-form', form: 'gallery-form', modal: 'add-gallery-modal',
    fields: ['title', 'caption', 'category', 'location', 'year', 'image'], checkbox: 'featured',
    createdMessage: 'Foto baru berhasil ditambahkan!', deleteMessage: 'Yakin ingin menghapus foto ini?', buildCard: buildGalleryCardElement,
});
</script>
