<tr id="contact-{{ contact.pk }}" class="contact-row">
  <td>
    <label class="sr-only" for="edit-name-{{ contact.pk }}">Nama</label>
    <input id="edit-name-{{ contact.pk }}" name="name" type="text" maxlength="100" required
           value="{{ form.name.value|default_if_none:'' }}" form="edit-form-{{ contact.pk }}">
    {{ form.name.errors }}
  </td>
  <td>
    <label class="sr-only" for="edit-email-{{ contact.pk }}">Email</label>
    <input id="edit-email-{{ contact.pk }}" name="email" type="email" maxlength="254" required
           value="{{ form.email.value|default_if_none:'' }}" form="edit-form-{{ contact.pk }}">
    {{ form.email.errors }}
  </td>
  <td>
    <label class="sr-only" for="edit-phone-{{ contact.pk }}">Telepon</label>
    <input id="edit-phone-{{ contact.pk }}" name="phone" type="tel" maxlength="30"
           value="{{ form.phone.value|default_if_none:'' }}" form="edit-form-{{ contact.pk }}">
    {{ form.phone.errors }}
  </td>
  <td class="actions">
    <form id="edit-form-{{ contact.pk }}" hx-put="{% url 'contacts:contact_update' contact.pk %}"
          hx-target="#contact-{{ contact.pk }}" hx-swap="outerHTML" hx-disabled-elt="find button">
      <button type="submit">Simpan</button>
      {{ form.non_field_errors }}
    </form>
    <button type="button" hx-get="{% url 'contacts:contact_row' contact.pk %}"
            hx-target="#contact-{{ contact.pk }}" hx-swap="outerHTML">Batal</button>
  </td>
</tr>
